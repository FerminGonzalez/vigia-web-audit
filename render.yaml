# -----------------------------------------------------------------------------
# Render Blueprint — Vigia Web Audit
# Despliega: servicio web (Docker) + 2 cron jobs + PostgreSQL.
#
# Uso: en Render, "New > Blueprint" y apunta a este repositorio.
# Rellena los secretos marcados con `sync: false` en el panel de Render.
# -----------------------------------------------------------------------------
services:
  # --- API + paginas web ---
  - type: web
    name: vigia-web-audit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
          property: connectionString
      # El cron corre como servicio aparte; desactivamos el in-process.
      - key: CRON_ENABLED
        value: "false"
      - key: CRON_TIMEZONE
        value: America/Panama
      # --- Pagos ---
      - key: PAYMENT_PROVIDER
        value: paddle
      - key: PADDLE_ENVIRONMENT
        value: production
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: PADDLE_PRICE_ID_PRO
        sync: false
      - key: PADDLE_PRICE_ID_AGENCY
        sync: false
      # --- Correo ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      # --- IA ---
      - key: AI_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- Auditoria / seguridad ---
      - key: PAGESPEED_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PORTAL_SIGNING_SECRET
        sync: false

  # --- Cron semanal: auditorias ---
  - type: cron
    name: vigia-audit-weekly
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 8 * * 1"
    dockerCommand: node dist/jobs/run-once.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: CRON_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: paddle
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PORTAL_SIGNING_SECRET
        sync: false

  # --- Cron diario: nutricion de leads ---
  - type: cron
    name: vigia-nurture-daily
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 9 * * *"
    dockerCommand: node dist/jobs/run-nurture-once.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigia-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: CRON_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PORTAL_SIGNING_SECRET
        sync: false

databases:
  - name: vigia-db
    plan: free
    databaseName: vigia
    user: vigia
