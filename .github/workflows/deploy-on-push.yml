# -----------------------------------------------------------------------------
# Redeploy en Render en cada push a main.
#
# El servicio se creo por API y no quedo enlazado el webhook de GitHub, por eso
# el auto-deploy de Render no se dispara. Este workflow lo reemplaza: al hacer
# push a main, pide a la API de Render un nuevo deploy del ultimo commit.
#
# Requisitos (ya configurados):
#   - Variable de repo: RENDER_SERVICE_ID  (ej. srv-xxxxxxxx)
#   - Secret de repo:   RENDER_API_KEY     (Account Settings > API Keys)
# -----------------------------------------------------------------------------
name: Deploy en Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Faltan RENDER_SERVICE_ID (variable) o RENDER_API_KEY (secret)"; exit 1
          fi
          echo "Solicitando deploy del servicio $RENDER_SERVICE_ID ..."
          curl -sS --fail-with-body -m 90 \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
          echo
          echo "Deploy solicitado."
